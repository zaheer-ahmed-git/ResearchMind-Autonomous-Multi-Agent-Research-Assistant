services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn research_agent.api.main:app --app-dir src --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      USE_LLM: "false"
      CORS_ORIGINS: "http://localhost:3000"
